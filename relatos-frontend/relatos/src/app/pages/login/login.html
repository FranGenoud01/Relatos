<mat-card class="auth-card">
  <div class="auth-header">
    <div class="auth-icon">
      <mat-icon>medical_services</mat-icon>
    </div>
    <h2>Ingresar</h2>
    <p class="auth-subtitle">Accedé a tu cuenta para valorar y comentar relatos.</p>
  </div>

  <mat-card-content [formGroup]="form" class="auth-form">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      <mat-error *ngIf="f.email.touched && f.email.invalid">Ingresá un email válido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      <mat-error *ngIf="f.password.touched && f.password.invalid">La contraseña es obligatoria</mat-error>
    </mat-form-field>

    <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

    <div class="actions">
      <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading">
        Ingresar
      </button>
    </div>

    <div class="loading" *ngIf="loading">
      <mat-spinner diameter="24"></mat-spinner>
    </div>

    <p class="switch-link">¿No tenés cuenta? <a routerLink="/registro">Registrate</a></p>
  </mat-card-content>
</mat-card>
