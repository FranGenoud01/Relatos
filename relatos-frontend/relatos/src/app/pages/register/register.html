<mat-card class="auth-card">
  <div class="card-header">
    <h2>Crear cuenta</h2>
  </div>

  <mat-card-content [formGroup]="form" class="auth-form">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" autocomplete="name" />
      <mat-error *ngIf="f.name.touched && f.name.invalid">El nombre es obligatorio</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      <mat-error *ngIf="f.email.touched && f.email.invalid">Ingresá un email válido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="new-password" />
      <mat-error *ngIf="f.password.touched && f.password.invalid">Mínimo 8 caracteres</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Confirmar contraseña</mat-label>
      <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
      <mat-error *ngIf="f.confirmPassword.touched && form.errors?.['passwordsMismatch']">
        Las contraseñas no coinciden
      </mat-error>
    </mat-form-field>

    <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>

    <div class="actions">
      <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading">
        Crear cuenta
      </button>
    </div>

    <div class="loading" *ngIf="loading">
      <mat-spinner diameter="24"></mat-spinner>
    </div>

    <p class="switch-link">¿Ya tenés cuenta? <a routerLink="/login">Ingresá</a></p>
  </mat-card-content>
</mat-card>
